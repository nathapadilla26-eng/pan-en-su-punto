<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pan en su punto - Gestión de inventarios</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <nav class="menu-lateral">
        <button id="btn-cerrar-menu" class="btn-cerrar-menu">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="logo-contenedor">
            <img src="../img/logo.jpg" alt="Logo Pan en su punto">
        </div>
        <ul>
            <li><a href="../panel.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
            <li><a href="../modulo usuarios/usuarios.html"><i class="fa-solid fa-users"></i> Usuarios</a></li>
            <li><a href="../modulo inventario/inventario-inicio.html" class="activo"><i class="fa-solid fa-box"></i> Inventario</a></li>
            <li><a href="../modulo recetas/recetas-inicio.html"><i class="fa-solid fa-book"></i> Recetas</a></li>
            <li><a href="../modulo produccion/produccion-inicio.html"><i class="fa-solid fa-fire-burner"></i> Producción</a></li>
            <li><a href="../modulo ventas/ventas-inicio.html"><i class="fa-solid fa-cash-register"></i> Ventas</a></li>
            <li><a href="../modulo reportes/reportes-inicio.html"><i class="fa-solid fa-chart-line"></i> Reportes</a></li>
            <li><a href="../configuracion.html"><i class="fa-solid fa-gear"></i> Configuración</a></li>
        </ul>
    </nav>
    <main class="contenido-principal">
        <header class="barra-superior">
            <div class="buscador">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Buscar...">
            </div>
            <div class="iconos-usuario">
                <i class="fa-regular fa-bell"></i>
                <div class="avatar-usuario">A</div>
            </div>
        </header>

       <div class="encabezado-seccion">
    <div class="titulos">
        <h2>Añadir Proveedor</h2>
        <p>Registra los datos de una nueva empresa o distribuidor.</p>
    </div>
</div>

<div class="tarjeta-datos">
    <form class="formulario-estandar">
        <div class="grid-formulario">
            <div class="grupo-form">
                <label>NIT / Documento *</label>
                <input type="text" placeholder="Ej: 900.123.456-7" required>
            </div>
            <div class="grupo-form">
                <label>Empresa *</label>
                <input type="text" placeholder="Ej: Insumos Panaderos SAS" required>
            </div>
            <div class="grupo-form">
                <label>Persona de Contacto *</label>
                <input type="text" placeholder="Ej: Carlos Gómez" required>
            </div>
            <div class="grupo-form">
                <label>Teléfono *</label>
                <input type="tel" placeholder="Ej: 310 123 4567" required>
            </div>
            <div class="grupo-form">
                <label>Dirección</label>
                <input type="text" placeholder="Ej: Calle 50 # 21-56">
            </div>
            <div class="grupo-form">
                <label>Correo Electrónico</label>
                <input type="email" placeholder="Ej: ventas@insumos.com">
            </div>
        </div>
        
        <div class="grupo-form ancho-completo">
            <label>Notas adicionales</label>
            <textarea placeholder="Días de entrega, condiciones de pago, horarios..." rows="3"></textarea>
        </div>

       <div class="acciones-formulario">
                    <a href="proveedores.html" class="btn-secundario">Cancelar</a>
                    <button type="button" id="btn-guardar-proveedor" class="btn-principal">Guardar Proveedor</button>
                </div>
            </form>
        </div>

        <!-- Modal de Éxito -->
        <div id="modal-exito" class="fondo-modal oculto">
            <div class="contenido-modal centrado">
                <div class="icono-exito">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h3>¡Proveedor guardado!</h3>
                <p>El proveedor se ha registrado correctamente en el sistema.</p>
                <a href="proveedores.html" class="btn-principal boton-ancho">Aceptar</a>
            </div>
        </div>
    </main>
    <script src="../js/"main.js"></script>
</body>

</html>
