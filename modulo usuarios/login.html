<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pan en su punto - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pantalla-login">
    <main class="login-container">
        <div class="login-box">

            <!-- Zona del Logo -->
            <div class="logo-container">
                <img src="img/logo.jpg" alt="Logo Pan en su punto" class="logo">
            </div>

            <!-- Formulario de Ingreso -->
            <form id="loginForm">
                <div class="input-group">
                    <div id="mensaje-error" class="alerta-error oculto">
                        Usuario o contraseña incorrectos
                    </div>
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" placeholder="Ingrese su usuario">
                </div>

                <div class="input-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" placeholder="Ingrese su contraseña">
                </div>

                <button type="submit" class="btn-primary">INGRESAR</button>
            </form>

        </div>
    </main>
    <script src="js/main.js"></script>
</body>

</html>
